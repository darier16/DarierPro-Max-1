
name: DarierPro Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalacja
        run: npm install

      - name: Budowanie aplikacji
        run: npm run build

      - name: Instalacja Androida
        run: npx cap add android

      - name: Synchronizacja
        run: npx cap sync android

      - name: Budowanie APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Pobierz APK
        uses: actions/upload-artifact@v4
        with:
          name: DarierPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
